name: Code Quality
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group code-quality

      - name: Run pre-commit with debug
        run: |
          echo "Running pre-commit hooks with verbose output..."
          # Test the command directly: the step shell runs with `set -e`, so a
          # separate `$?` check after a failing command is never reached.
          if ! uv run pre-commit run --all-files --verbose; then
            echo "Pre-commit failed. Showing git status:"
            git status
            echo "Showing git diff:"
            git diff
            exit 1
          fi
