version: 2
updates:
  # "uv" updates uv.lock together with pyproject.toml; "pip" would leave the
  # lock stale and fail the `uv lock --check` job on every update.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "black"
          - "ruff"
          - "docformatter"
          - "pre-commit*"
      test-dependencies:
        patterns:
          - "pytest*"
          - "coverage"
      production-dependencies:
        patterns:
          - "django*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
